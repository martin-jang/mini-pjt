# Legacy2Next 에이전트 설정. 비밀값(계정·키)은 여기 두지 않고 .env에만 둔다

# 한 번 실행당 한도 (G8)
limits:
  llm_calls_per_run: 200
  verifier_retries: 3
  # Router(질의 분류) LLM 호출 수 상한 (서버 프로세스 단위)
  router_calls: 1000

# 콘솔 UI 개발 서버 (CORS 허용)
cors_origins:
  - http://localhost:5173

# 실행 로그 저장 위치 (저장소 루트 기준, git 제외)
log_dir: logs

# LangGraph 체크포인트 (승인 대기 실행을 서버 재시작 후에도 이어 가기 위함, git 제외)
checkpoint_path: checkpoints.sqlite

# 스텁 노드의 단계 간 지연(ms). 실제 노드가 붙으면 쓰지 않는다
stub_step_ms: 500

# 사이트별 생성 결과물 루트 (G9: 에이전트는 이 아래 <별칭>/ 밖에 쓰지 않는다)
output_root: next-pjt

# 로그인 세션(storageState) 저장 위치. next-pjt 밖, git 제외 (G10)
session_dir: sessions

# 화면 수집. mode: mcp(Playwright MCP 실제 브라우저) / stub(브라우저 없이 예시 데이터)
explorer:
  mode: mcp
  headless: true
  # Map(사이트맵) 상한: 수집 화면 수, 링크 깊이, 같은 형태 URL(예: 게시글 상세) 수
  max_screens: 40
  max_depth: 3
  max_per_pattern: 5
  # 흐름 걷기(Walk): 완주 목표 수(2~3개 모이면 멈춤), 시도할 후보 수, 흐름 하나의 단계 상한
  walk_enabled: true
  walk_target: 3
  walk_max_candidates: 6
  walk_max_steps: 8
  # 사용자 인증 브라우저 창을 띄우지 않음 (테스트용). 실제로는 false로 두고 사용자가 창에서 인증한다
  auth_headless: false
  # 한 실행에서 로그인·인증을 다시 시도하는 횟수 상한 (세션 만료 재요청 포함)
  login_attempts: 3

# 사이트별 설정. 키는 사이트 별칭이다. 설정이 없는 사이트는 요청 URL의 origin만 허용한다
sites: {}
#  hr-portal:
#    # 요청 URL origin 밖이지만 꼭 필요한 origin (예: 다른 도메인의 SSO 로그인). G2
#    extra_origins:
#      - https://sso.example.com
#    # 시작 화면이 로그인 화면이 아니면 로그인 화면 주소를 적는다 (허용 origin 안)
#    login_url: https://hr.example.com/login
#    # extension: 사용자가 이미 로그인한 Chrome에 붙는다 (보안 프로그램 때문에 자동화 브라우저 인증이 안 될 때)
#    browser: isolated
# 계정은 .env에 SITE_<별칭 대문자, -는 _>_USERNAME / _PASSWORD 로 넣는다 (예: SITE_HR_PORTAL_USERNAME)
