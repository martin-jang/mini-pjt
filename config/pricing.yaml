# LLM 단가표 (USD / 1M 토큰) — scripts/cost_dashboard.py가 예상 비용 계산에 씁니다.
# 로그에는 토큰 수만 남기므로 단가를 고치면 과거 사용량도 새 단가로 다시 계산됩니다.
# 확인일: 2026-11-19. 실제 청구액과 다를 수 있는 "예상치"입니다.

# 1) 개발한 시스템이 쓰는 모델 (Amazon Bedrock, us-east-1)
#    Bedrock 단가는 AWS 요금표 기준으로 확인 후 고치세요: https://aws.amazon.com/bedrock/pricing/
system:
  us.anthropic.claude-sonnet-4-5-20250929-v1:0:
    input: 3.00
    output: 15.00
  amazon.titan-embed-text-v2:0:
    input: 0.02
    output: 0.0

# 2) Claude Code가 쓴 모델 (Anthropic API 정가 기준 환산)
#    구독(Pro/Max)으로 쓰는 경우 실제 청구액이 아니라 "API로 썼다면" 금액입니다.
#    cache_write_5m = 입력 x1.25, cache_write_1h = 입력 x2, cache_read = 입력 x0.1
claude_code:
  claude-opus-5-5:
    input: 4.00
    output: 20.00
    cache_write_5m: 5.00
    cache_write_1h: 8.00
    cache_read: 0.20
    fast_multiplier: 2.0
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_write_5m: 0.125
    cache_write_1h: 0.20
    cache_read: 0.01
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_write_5m: 2.50
    cache_write_1h: 4.00
    cache_read: 0.10
  claude-fable-5-2:
    input: 8.00
    output: 40.00
    cache_write_5m: 10.00
    cache_write_1h: 16.00
    cache_read: 0.20
