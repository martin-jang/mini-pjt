# Legacy2Next 설정 파일
# 사이트 고유 값(도메인·시작 URL·계정)은 이 파일과 .env에만 둡니다.
# 에이전트 코드(src/)에는 특정 사이트 이름이나 URL을 하드코딩하지 않습니다 (CLAUDE.md 과적합 방지 규칙).

target:
  # 크롤링을 허용할 도메인 목록 (G1). 이 밖의 도메인·사설 IP는 모두 거부합니다.
  allowed_domains:
    - parabank.parasoft.com
  # 분석 시작 URL
  start_url: https://parabank.parasoft.com/parabank/index.htm
  # 데모 계정은 값이 아니라 환경변수 이름만 둡니다. 실제 값은 .env에 있습니다.
  demo_account_env:
    username: DEMO_USERNAME
    password: DEMO_PASSWORD
  # 결과물 이름 (output/{project_name})
  project_name: parabank-next
  # 가드레일 G2의 유일한 예외: 결과 화면 수집을 위해 승인 후 1회만 제출할 수 있는 폼
  # 이 목록에 없는 폼은 승인을 받아도 제출하지 않습니다.
  submit_once:
    - name: transfer
      page_path: /parabank/transfer.htm
      form_id: transferForm
      # 최소 더미 값. select는 옵션 인덱스(0=첫 번째, 1=두 번째)
      values:
        input: "1"
        fromAccountId: { option_index: 0 }
        toAccountId: { option_index: 1 }

# 추가 분석 대상 (일반화 검증용). 구조는 target 과 같습니다. 질문 URL의 호스트로 대상을 고릅니다.
extra_targets:
  # 로컬에 띄운 전자정부 표준프레임워크 내부업무 템플릿 (저장소 밖 legacy-samples 폴더, 교육용 샘플)
  - allowed_domains:
      - localhost
    start_url: http://localhost:8080/
    demo_account_env:
      username: EGOV_USERNAME
      password: EGOV_PASSWORD
    project_name: egov-next
    # G1 예외: 이 대상만 루프백(127.0.0.1)을 허용하고, 아래 포트로만 접근합니다
    allow_loopback_ports: [8080]
    submit_once: []

llm:
  # 교육 고정 모델은 us.anthropic.claude-sonnet-4-5-20250929-v1:0 (us-east-1).
  # us-east-1 일일 토큰 한도 초과로 사용자 지시에 따라 2026-11-19 전환 (환경변수 LLM_MODEL_ID·LLM_REGION 으로 덮어쓰기 가능)
  model_id: global.anthropic.claude-sonnet-4-6
  region: ap-northeast-2
  # 임베딩은 기존 벡터 인덱스와 맞추기 위해 그대로 유지
  embed_model_id: amazon.titan-embed-text-v2:0
  embed_region: us-east-1

crawl:
  max_depth: 2
  max_pages: 30
  timeout_ms: 15000
  # live: 실제 사이트 크롤링 / replay: data/snapshots 재생 (평가·시연 기본값)
  snapshot_mode: replay

paths:
  snapshots: data/snapshots
  fixtures: data/fixtures
  analysis: data/analysis
  output: output
  template: templates/tobe-app
  chroma: chroma_db
  checkpoints: checkpoints.sqlite
  trace_log: logs/trace.jsonl

server:
  host: 127.0.0.1
  port: 8000
